version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlin.*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      hilt:
        patterns:
          - "com.google.dagger*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
